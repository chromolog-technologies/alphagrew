name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (SQLite, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (composer.json) and the version used for local development.
        php: ['8.2', '8.5']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  backend-mysql-migrations:
    name: Migrations on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: alphagrew
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: alphagrew
      DB_USERNAME: root
      DB_PASSWORD: root
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Migrate, seed, roll back and migrate again
        run: |
          php artisan migrate --seed --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

  frontend:
    name: Frontend type check, tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  backend-image:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag alphagrew-api:ci backend
      - name: PHP extensions and tools the app needs are present
        run: |
          modules="$(docker run --rm --entrypoint php alphagrew-api:ci -m)"
          for ext in pdo_mysql zip intl 'Zend OPcache' pcntl bcmath; do
            echo "$modules" | grep -qx "$ext" || { echo "missing PHP extension: $ext"; exit 1; }
          done
          docker run --rm --entrypoint sh alphagrew-api:ci -c 'command -v pdftotext && command -v supervisord && php artisan --version'
